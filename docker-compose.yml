services:
  trading-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: trading
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    networks:
      - trading-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading"]
      interval: 5s
      timeout: 3s
      retries: 10

  trading-gateway:
    build: .
    entrypoint: ["python3", "execution_gateway.py"]
    environment:
      VBOS_API_URL: ${VBOS_API_URL:-https://api.vbos.cloud}
      VBOS_API_KEY: ${VBOS_API_KEY}
      VBOS_PROJECT_ID: ${VBOS_PROJECT_ID}
      VBOS_ENVIRONMENT_ID: ${VBOS_ENVIRONMENT_ID}
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      ALPACA_BASE_URL: ${ALPACA_BASE_URL:-https://paper-api.alpaca.markets}
      GATEWAY_DB_PATH: /data/gateway.db
      GATEWAY_PORT: "9093"
    volumes:
      - gateway-data:/data
    networks:
      - trading-net
    depends_on:
      trading-postgres:
        condition: service_healthy

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://trading:trading@trading-postgres:5432/trading
      GATEWAY_URL: http://trading-gateway:9093
    networks:
      - trading-net
    depends_on:
      trading-postgres:
        condition: service_healthy
    profiles:
      - app

volumes:
  pgdata:
  gateway-data:

networks:
  trading-net:
